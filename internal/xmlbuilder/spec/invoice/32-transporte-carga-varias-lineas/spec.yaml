case: transporte-carga-varias-lineas
document: cpe
why: >-
  The trip describes the whole comprobante and SUNAT requires one occurrence
  of each tag, so the cac:Delivery block rides on the first line only.
sources:
  - "AjustesValidacionesCPEv20260212.xlsx › Factura2_0"
assert:
  - xpath: "//cac:Delivery"
    count: 1
  - xpath: "/*/cac:InvoiceLine[cbc:ID='1']/cac:Delivery"
  - xpath: "/*/cac:InvoiceLine[cbc:ID='2']/cac:Delivery"
    absent: true
