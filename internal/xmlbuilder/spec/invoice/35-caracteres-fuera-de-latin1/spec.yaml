case: caracteres-fuera-de-latin1
document: cpe
why: >-
  Text pasted from a word processor carries characters ISO-8859-1 cannot
  encode (curly quotes, em dash, €). The document must still be produced,
  with each such character written as an XML numeric character reference so
  the text round-trips; alternatively the API must reject the draft with a
  clear message before issuing.
sources:
  - "XML 1.0 §4.1 character references"
assert:
  - xpath: "/*/cac:InvoiceLine[cbc:ID='1']/cac:Item/cbc:Description"
    equals: "Cable “HDMI” — 2m €"
