case: factura-isc-lineas-mixtas
document: cpe
why: >-
  With one ISC line and one plain line the document ISC subtotal's base is
  the ISC line's base (100), not the document's whole valor de venta (200).
sources:
  - "resources/reglas/reglas-validacion-cpe-2026-08-26.xlsx › Factura2_0"
assert:
  - xpath: "/*/cac:TaxTotal/cac:TaxSubtotal[cac:TaxCategory/cac:TaxScheme/cbc:ID='2000']/cbc:TaxableAmount"
    equals: "100.00"
    sunat: "3296"
  - xpath: "/*/cac:TaxTotal/cac:TaxSubtotal[cac:TaxCategory/cac:TaxScheme/cbc:ID='1000']/cbc:TaxableAmount"
    equals: "220.00"
    why: >-
      120 (with ISC) + 100
  - xpath: "/*/cac:TaxTotal/cac:TaxSubtotal[cac:TaxCategory/cac:TaxScheme/cbc:ID='1000']/cbc:TaxAmount"
    equals: "39.60"
  - xpath: "/*/cac:TaxTotal/cbc:TaxAmount"
    equals: "59.60"
    sunat: "3294"
  - xpath: "/*/cac:InvoiceLine[cbc:ID='2']/cac:TaxTotal/cac:TaxSubtotal[cac:TaxCategory/cac:TaxScheme/cbc:ID='2000']"
    absent: true
