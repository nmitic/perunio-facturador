case: gratuito-inafecto-codigos-32-a-37
document: cpe
why: >-
  Every inafecto-gratuito código (Cat.07 32-37) behaves like 31: referencial
  under 9996, rate tag 0.00, no IGV fallback subtotal.
sources:
  - "CLAUDE.md › Critical SUNAT Gotchas (verified against accepted SUNAT CDRs)"
  - "greenter reference output (github.com/thegreenter/greenter)"
  - "resources/reglas/reglas-validacion-cpe-2026-08-26.xlsx › Factura2_0"
assert:
  - xpath: "/*/cac:InvoiceLine"
    count: 6
  - xpath: "/*/cac:InvoiceLine/cac:TaxTotal/cac:TaxSubtotal[cac:TaxCategory/cac:TaxScheme/cbc:ID='9996'][cbc:TaxableAmount='100.00'][cac:TaxCategory/cbc:Percent='0.00']"
    count: 6
  - xpath: "/*/cac:TaxTotal/cac:TaxSubtotal[cac:TaxCategory/cac:TaxScheme/cbc:ID='9996']/cbc:TaxableAmount"
    equals: "600.00"
  - xpath: "/*/cac:TaxTotal/cac:TaxSubtotal[cac:TaxCategory/cac:TaxScheme/cbc:ID='1000']"
    count: 0
    sunat: "3224"
  - xpath: "//cbc:Percent[.='18.00']"
    count: 0
