case: descuento-por-item
document: cpe
why: >-
  NC motivo 05 with a descuento por ítem. SUNAT's note line has no line
  AllowanceCharge and computes the value as Quantity × Price, so the
  descuento is baked into a NET cac:Price (50 = 50 / 1).
sources:
  - "CLAUDE.md › Critical SUNAT Gotchas (verified against accepted SUNAT CDRs)"
  - "Guía de elaboración XML Nota de Crédito 2.1 (resources/guia+xml+nota de crédito*.pdf), punto 29"
assert:
  - xpath: "/*/cac:CreditNoteLine[cbc:ID='1']/cac:AllowanceCharge"
    absent: true
    why: >-
      An InvoiceLine-style allowance is ignored → fault 3271
  - xpath: "/*/cac:CreditNoteLine[cbc:ID='1']/cac:Price/cbc:PriceAmount"
    equals: "50.00"
  - xpath: "/*/cac:CreditNoteLine[cbc:ID='1']/cbc:LineExtensionAmount"
    equals: "50.00"
