case: detraccion
document: cpe
why: >-
  A nota de crédito on a factura sujeta a detracción mirrors the detracción
  block (leyenda 2006, cuenta BN, Detraccion PaymentTerms in PEN). SUNAT's
  NotaCredito2_0 sheet has no detracción rule at all, so SUNAT neither
  requires nor checks this block on a note; these assertions pin Perunio's
  output (the customer's copy shows the detracción), not a SUNAT rule.
sources:
  - "resources/reglas/reglas-validacion-cpe-2026-08-26.xlsx › NotaCredito2_0 (no detracción rules)"
assert:
  - xpath: "/*/cbc:Note[@languageLocaleID='2006']"
  - xpath: "/*/cac:PaymentMeans/cbc:ID"
    equals: "Detraccion"
  - xpath: "/*/cac:PaymentMeans/cbc:PaymentMeansCode"
    equals: "999"
  - xpath: "/*/cac:PaymentMeans/cac:PayeeFinancialAccount/cbc:ID"
    equals: "00-123-456789"
    why: >-
      Cuenta de detracciones del Banco de la Nación
  - xpath: "/*/cac:PaymentTerms[cbc:ID='Detraccion']/cbc:PaymentMeansID"
    equals: "019"
    why: >-
      Cat.54 bien o servicio
  - xpath: "/*/cac:PaymentTerms[cbc:ID='Detraccion']/cbc:PaymentPercent"
    equals: "12.00"
  - xpath: "/*/cac:PaymentTerms[cbc:ID='Detraccion']/cbc:Amount"
    equals: "141.60"
  - xpath: "/*/cac:PaymentTerms[cbc:ID='Detraccion']/cbc:Amount/@currencyID"
    equals: "PEN"
  - before:
      - "/*/cac:PaymentMeans"
      - "/*/cac:PaymentTerms"
