case: devolucion-parcial
document: cpe
why: >-
  NC motivo 07 (devolución por ítem): 1 of the 10 units invoiced comes back,
  so the note carries only that unit and its totals.
sources:
  - "resources/reglas/reglas-validacion-cpe-2026-08-26.xlsx › NotaCredito2_0"
assert:
  - xpath: "/*/cac:DiscrepancyResponse/cbc:ResponseCode"
    equals: "07"
  - xpath: "/*/cac:CreditNoteLine[cbc:ID='1']/cbc:CreditedQuantity"
    equals: "1"
  - xpath: "/*/cac:CreditNoteLine[cbc:ID='1']/cbc:LineExtensionAmount"
    equals: "100.00"
  - xpath: "/*/cac:LegalMonetaryTotal/cbc:PayableAmount"
    equals: "118.00"
