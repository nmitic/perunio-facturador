case: remitente-en-gre-transportista
document: despatch
why: >-
  On a GRE transportista the remitente whose goods travel is
  cac:Shipment/cac:Delivery/cac:Despatch/cac:DespatchParty (id, Cat.06 type,
  name). The Transportista sheet and its XSL have no cac:SellerSupplierParty
  at all.
sources:
  - "resources/reglas/reglas-validacion-gre-2026-09-25.xlsx › Guía-Transportista2_0"
  - "resources/xsl/gre/ValidaExprRegGreTransportista-2.0.1.xsl"
pending: >-
  Finding F16: buildDespatchTransportistaXML puts the remitente in
  cac:SellerSupplierParty, which SUNAT ignores, so it reports the remitente
  as missing.
assert:
  - xpath: "/*/cac:Shipment/cac:Delivery/cac:Despatch/cac:DespatchParty/cac:PartyIdentification/cbc:ID"
    equals: "20100113612"
    sunat: "3383"
  - xpath: "/*/cac:Shipment/cac:Delivery/cac:Despatch/cac:DespatchParty/cac:PartyIdentification/cbc:ID/@schemeID"
    equals: "6"
    sunat: "2541"
  - xpath: "/*/cac:Shipment/cac:Delivery/cac:Despatch/cac:DespatchParty/cac:PartyLegalEntity/cbc:RegistrationName"
    equals: "EMPRESA TEST SAC"
    sunat: "3387"
  - xpath: "/*/cac:SellerSupplierParty"
    absent: true
