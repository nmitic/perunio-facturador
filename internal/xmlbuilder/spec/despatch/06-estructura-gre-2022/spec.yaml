case: estructura-gre-2022
document: despatch
why: >-
  GRE 2.0 (R.S. 123-2022/SUNAT) layout: the punto de partida is
  cac:Delivery/cac:Despatch/cac:DespatchAddress and the vehicle plate is
  cac:TransportHandlingUnit/cac:TransportEquipment/cbc:ID. SUNAT's GRE rules
  and its GRE validator XSL know no cac:OriginAddress and no
  cac:RoadTransport, so SUNAT ignores them and reports the real tags as
  missing.
sources:
  - "resources/reglas/reglas-validacion-gre-2026-09-25.xlsx › Guía-Remitente2_0"
  - "resources/xsl/gre/ValidaExprRegGreRemitente-2.0.1.xsl"
assert:
  - xpath: "/*/cac:Shipment/cac:Delivery/cac:Despatch/cac:DespatchAddress/cbc:ID"
    equals: "150101"
    sunat: "2775"
  - xpath: "/*/cac:Shipment/cac:Delivery/cac:Despatch/cac:DespatchAddress/cac:AddressLine/cbc:Line"
    equals: "AV. ORIGEN 100"
    sunat: "2577"
  - xpath: "/*/cac:Shipment/cac:TransportHandlingUnit/cac:TransportEquipment/cbc:ID"
    equals: "ABC123"
    sunat: "2566/2567"
