case: transportista
document: despatch
why: >-
  A GRE transportista (31) is issued by the carrier: the carrier is the
  DespatchSupplierParty and the remitente whose goods travel goes in
  cac:SellerSupplierParty.
sources:
  - "resources/reglas/reglas-validacion-gre-2026-09-25.xlsx › Guía-Remitente2_0 / Guía-Transportista2_0"
assert:
  - xpath: "/*/cbc:DespatchAdviceTypeCode"
    equals: "31"
  - xpath: "/*/cbc:ID"
    equals: "V001-00000001"
  - xpath: "/*/cac:DespatchSupplierParty/cac:Party/cac:PartyIdentification/cbc:ID"
    equals: "20555555555"
  - xpath: "/*/cac:SellerSupplierParty//cbc:ID[.='20100113612']"
    equals: "20100113612"
