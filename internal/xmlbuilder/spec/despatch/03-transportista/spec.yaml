case: transportista
document: despatch
why: >-
  A GRE transportista (31) is issued by the carrier, so the carrier is the
  DespatchSupplierParty and the series starts with V. (Where the remitente
  goes is pinned by despatch/08.)
sources:
  - "resources/reglas/reglas-validacion-gre-2026-09-25.xlsx › Guía-Transportista2_0"
  - "resources/xsl/gre/ValidaExprRegGreTransportista-2.0.1.xsl"
assert:
  - xpath: "/*/cbc:DespatchAdviceTypeCode"
    equals: "31"
    sunat: "1051"
  - xpath: "/*/cbc:ID"
    equals: "V001-00000001"
    sunat: "1001"
  - xpath: "/*/cac:DespatchSupplierParty/cac:Party/cac:PartyIdentification/cbc:ID"
    equals: "20555555555"
    sunat: "1034"
