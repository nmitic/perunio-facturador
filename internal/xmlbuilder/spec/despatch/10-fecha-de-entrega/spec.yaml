case: fecha-de-entrega
document: despatch
why: >-
  Since 01/06/2026 a GRE remitente with transporte público (Cat.18 01)
  states the date the goods are handed to the carrier (Fecha de entrega de
  bienes al transportista), in YYYY-MM-DD and not before the issue date.
  model.Despatch has no field for it yet, so the value itself is not pinned.
sources:
  - "resources/reglas/reglas-validacion-gre-2026-09-25.xlsx › Guía-Remitente2_0 (Control de Cambios 2026-06-01: ERR-3617/3618/3619)"
effective: "2026-06-01"
assert:
  - xpath: "/*/cac:Shipment/cac:ShipmentStage/cac:LoadingTransportEvent/cbc:OccurrenceDate"
    sunat: "3617"
  - xpath: "/*/cac:Shipment/cac:ShipmentStage/cac:LoadingTransportEvent/cbc:OccurrenceDate"
    matches: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    sunat: "3619"
  - xpath: "translate(/*/cac:Shipment/cac:ShipmentStage/cac:LoadingTransportEvent/cbc:OccurrenceDate, '-', '') >= translate(/*/cbc:IssueDate, '-', '')"
    true: true
    sunat: "3618"
