case: apellidos-del-conductor
document: despatch
why: >-
  The principal driver is declared with nombres (cbc:FirstName) AND
  apellidos (cbc:FamilyName), both non-empty. model.Despatch has a single
  driverName, so how to split it is the fix's call; the spec only requires
  both parts.
sources:
  - "resources/reglas/reglas-validacion-gre-2026-09-25.xlsx › Guía-Remitente2_0"
  - "resources/reglas/reglas-validacion-gre-2026-09-25.xlsx › Guía-Transportista2_0"
assert:
  - xpath: "string-length(normalize-space(/*/cac:Shipment/cac:ShipmentStage/cac:DriverPerson[cbc:JobTitle='Principal']/cbc:FirstName)) > 0"
    true: true
    sunat: "3360"
  - xpath: "string-length(normalize-space(/*/cac:Shipment/cac:ShipmentStage/cac:DriverPerson[cbc:JobTitle='Principal']/cbc:FamilyName)) > 0"
    true: true
    sunat: "3361"
