case: remitente-transporte-publico
document: despatch
why: >-
  Transporte público (Cat.18 01): a third-party carrier is identified by RUC
  and name, and no driver or vehicle of the emisor is declared.
sources:
  - "resources/reglas/reglas-validacion-gre-2026-09-25.xlsx › Guía-Remitente2_0"
  - "resources/xsl/gre/ValidaExprRegGreRemitente-2.0.1.xsl"
assert:
  - xpath: "/*/cac:Shipment/cac:ShipmentStage/cbc:TransportModeCode"
    equals: "01"
    sunat: "2532/2773"
  - xpath: "/*/cac:Shipment/cac:ShipmentStage/cac:CarrierParty/cac:PartyIdentification/cbc:ID"
    equals: "20555555555"
    sunat: "2558/2560"
  - xpath: "/*/cac:Shipment/cac:ShipmentStage/cac:CarrierParty/cac:PartyIdentification/cbc:ID/@schemeID"
    equals: "6"
    sunat: "2561/2485"
  - xpath: "/*/cac:Shipment/cac:ShipmentStage/cac:CarrierParty/cac:PartyLegalEntity/cbc:RegistrationName"
    equals: "TRANSPORTES SAC"
    sunat: "2563"
  - xpath: "/*/cac:Shipment//cac:DriverPerson"
    absent: true
    sunat: "3455"
  - xpath: "/*/cac:Shipment/cac:TransportHandlingUnit/cac:TransportEquipment/cbc:ID"
    absent: true
    sunat: "3354"
    why: >-
      No vehicle of the emisor on transporte público. This is where GRE 2.0
      reads the plate; no GRE rule reads cbc:LicensePlateID
