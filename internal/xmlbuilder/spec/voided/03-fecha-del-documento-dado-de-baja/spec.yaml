case: fecha-del-documento-dado-de-baja
document: voided
why: >-
  cbc:ReferenceDate is the issue date of the documents being voided, not the
  date of the RA. Voiding on 2024-01-16 a factura issued on 2024-01-15 must
  declare 2024-01-15.
sources:
  - "resources/reglas/reglas-validacion-cpe-2026-08-26.xlsx › Comunicación de Baja1_0"
assert:
  - xpath: "/*/cbc:ReferenceDate"
    equals: "2024-01-15"
    sunat: "2375/2671"
  - xpath: "/*/cbc:IssueDate"
    equals: "2024-01-16"
