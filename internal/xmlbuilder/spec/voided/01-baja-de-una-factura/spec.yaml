  - xpath: "/*/cac:AccountingSupplierParty/cbc:CustomerAssignedAccountID"
    equals: "20100113612"
    sunat: "1034"
  - xpath: "/*/cac:AccountingSupplierParty/cbc:AdditionalAccountID"
    equals: "6"
    sunat: "2288"
  - xpath: "/*/sac:VoidedDocumentsLine/cbc:LineID"
    equals: "1"
    sunat: "2306"
  - xpath: "/*/sac:VoidedDocumentsLine/cbc:DocumentTypeCode"
    equals: "01"
  - xpath: "/*/sac:VoidedDocumentsLine/sac:DocumentSerialID"
    equals: "F001"
    sunat: "2310"
  - xpath: "/*/sac:VoidedDocumentsLine/sac:DocumentNumberID"
