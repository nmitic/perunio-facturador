case: boleta-exonerada-igv-cero
document: summary
why: >-
  Every RC line declares its IGV/IVAP cac:TaxTotal, even when it is 0.00
  (the guide's examples always carry it).
sources:
  - "Guía de elaboración del Resumen Diario 1.1 (resources/guias/guia-resumen-diario-1.1-2018-01.pdf)"
  - "resources/reglas/reglas-validacion-cpe-2026-08-26.xlsx › Resumen Diario1_1"
assert:
  - xpath: "/*/sac:SummaryDocumentsLine/cac:TaxTotal[cac:TaxSubtotal/cac:TaxCategory/cac:TaxScheme/cbc:ID='1000']/cbc:TaxAmount"
    equals: "0.00"
    sunat: "2278"
  - xpath: "/*/sac:SummaryDocumentsLine/sac:BillingPayment[cbc:InstructionID='02']/cbc:PaidAmount"
    equals: "500.00"
