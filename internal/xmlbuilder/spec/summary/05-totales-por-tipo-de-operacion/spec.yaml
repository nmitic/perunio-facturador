case: totales-por-tipo-de-operacion
document: summary
why: >-
  BillingPayment carries one valor de venta per tipo de operación (Cat.11 /
  listado 017: 01 gravado, 02 exonerado, 03 inafecto, 05 gratuito), never
  two with the same InstructionID.
sources:
  - "Guía de elaboración del Resumen Diario 1.1 (resources/guias/guia-resumen-diario-1.1-2018-01.pdf)"
  - "resources/reglas/reglas-validacion-cpe-2026-08-26.xlsx › Resumen Diario1_1"
assert:
  - xpath: "/*/sac:SummaryDocumentsLine/sac:BillingPayment[cbc:InstructionID='01']/cbc:PaidAmount"
    equals: "1000.00"
  - xpath: "/*/sac:SummaryDocumentsLine/sac:BillingPayment[cbc:InstructionID='02']/cbc:PaidAmount"
    equals: "200.00"
  - xpath: "/*/sac:SummaryDocumentsLine/sac:BillingPayment[cbc:InstructionID='03']/cbc:PaidAmount"
    equals: "300.00"
  - xpath: "/*/sac:SummaryDocumentsLine/sac:BillingPayment[cbc:InstructionID='05']/cbc:PaidAmount"
    equals: "50.00"
  - xpath: "/*/sac:SummaryDocumentsLine/sac:BillingPayment"
    count: 4
    sunat: "2357"
  - xpath: "/*/sac:SummaryDocumentsLine/cbc:ID"
    equals: "B001-7"
