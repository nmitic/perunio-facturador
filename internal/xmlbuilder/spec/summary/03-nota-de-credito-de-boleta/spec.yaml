case: nota-de-credito-de-boleta
document: summary
why: >-
  A nota de crédito on a boleta is reported in the RC with a
  cac:BillingReference to the boleta it modifies; only notes carry that
  reference.
sources:
  - "Guía de elaboración del Resumen Diario 1.1 (resources/GUIA_Resumen_de_Boletas_11-01-2018*.pdf)"
  - "AjustesValidacionesCPEv20260212.xlsx › Resumen Diario1_1"
pending: >-
  Finding F6: RC lines use the Resumen 1.0 range shape (sac:DocumentSerialID
  + Start/EndDocumentNumberID) under CustomizationID 1.1, which identifies
  each comprobante with one cbc:ID per line (guía RC 1.1; ERR 2512).
assert:
  - xpath: "/*/sac:SummaryDocumentsLine/cbc:DocumentTypeCode"
    equals: "07"
  - xpath: "/*/sac:SummaryDocumentsLine/cbc:ID"
    equals: "BC01-3"
  - xpath: "/*/sac:SummaryDocumentsLine/cac:BillingReference/cac:InvoiceDocumentReference/cbc:ID"
    equals: "B001-7"
    sunat: "2524"
  - xpath: "/*/sac:SummaryDocumentsLine/cac:BillingReference/cac:InvoiceDocumentReference/cbc:DocumentTypeCode"
    equals: "03"
    sunat: "2583"
  - before:
      - "/*/sac:SummaryDocumentsLine/cac:BillingReference"
      - "/*/sac:SummaryDocumentsLine/cac:Status"
